<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Tech-Construct Brand Logo -->
  <defs>
    <linearGradient id="tc-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tc-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="tc-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Isometric Hexagon / Building Node Icon -->
  <g transform="translate(6, 6)">
    <!-- Base shadow/ambient -->
    <path d="M 26 2 L 48 14 L 48 38 L 26 50 L 4 38 L 4 14 Z" fill="url(#tc-dark)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Top Face (Blueprint / Solar grid) -->
    <path d="M 26 3 L 47 14 L 26 25 L 5 14 Z" fill="url(#tc-blue)" />
    <!-- Grid line inside top face -->
    <path d="M 15.5 8.5 L 36.5 19.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
    <path d="M 36.5 8.5 L 15.5 19.5" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />

    <!-- Left Face (Steel beam structure) -->
    <path d="M 5 15 L 25 26 L 25 49 L 5 38 Z" fill="#0369a1" />
    <circle cx="15" cy="32" r="2.5" fill="#38bdf8" />
    <path d="M 15 19 L 15 44" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Right Face (Construction girder with crane accent) -->
    <path d="M 27 26 L 47 15 L 47 38 L 27 49 Z" fill="url(#tc-orange)" />
    <!-- Stylized Crane Hook / Structural T inside right face -->
    <path d="M 37 21 L 37 36 M 32 25 L 42 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="37" cy="40" r="2" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="21" fill="#ffffff" letter-spacing="1">
    TECH<tspan fill="#38bdf8">-</tspan><tspan fill="#fbbf24">CONSTRUCT</tspan>
  </text>
  <text x="69" y="47" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="9" fill="#94a3b8" letter-spacing="1.8">
    ENTERPRISE INVENTORY &amp; SUPPLY
  </text>
</svg>
