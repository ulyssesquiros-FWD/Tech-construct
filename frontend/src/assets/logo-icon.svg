    <circle cx="15" cy="34" r="2.5" fill="#38bdf8" />
    <path d="M 15 21 L 15 45" stroke="#0284c7" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Right Face (Construction Accent) -->
    <path d="M 27 28 L 47 17 L 47 39 L 27 50 Z" fill="url(#tc-icon-orange)" />
    <path d="M 37 23 L 37 38 M 32 27 L 42 27" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
